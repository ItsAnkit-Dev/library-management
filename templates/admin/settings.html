{% extends "base.html" %}
{% block title %}Settings{% endblock %}
{% block content %}
<h2>Settings</h2>
<form method="POST">
  {{ form.hidden_tag() }}
  {% for field in form if field.name != 'csrf_token' %}
    <div class="mb-3">
      {{ field.label }} {{ field(class="form-control") }}
    </div>
  {% endfor %}
  <button type="submit" class="btn btn-primary">Save</button>
</form>
{% endblock %}
